[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "seat-allocation-solver"
version = "0.1.0"
description = "CP-SAT seat allocation prototype for the PJ Kwan Inn Teng FYP case study"
requires-python = ">=3.11"
dependencies = [
    "ortools>=9.10",
    "jsonschema>=4.21",
    "psutil>=5.9",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
